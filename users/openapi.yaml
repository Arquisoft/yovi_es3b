openapi: 3.0.0
info:
  title: User Service API
  version: 1.0.0
  description: API for managing users
paths:
  /users/me:
    get:
      summary: Returns current session user
      description: Given firebase ID from the auth middleware, returns the profile info for that user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    example: "64a7f3bc2e4e2a001f3d1234"
                  username:
                    type: string
                    example: "testuser"
                  gamesPlayed:
                    type: integer
                    example: 10
                  gamesWon:
                    type: integer
                    example: 6
                  gamesLost:
                    type: integer
                    example: 4
                  createdAt:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
        '401':
          description: Unauthorized – missing or invalid token
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "userNotFound"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
  /users:
    get:
      summary: Returns top 50 users in the points ranking
      description: |
        Returns a ranked list of up to 50 users sorted by accumulated points (clamped at 0).
        Points formula: Classic win +1000, Master Y win +600, Fortune Y win +400, any loss -200.
        If `difficulty` is provided, only games of that difficulty count toward the ranking.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: query
          name: difficulty
          required: false
          schema:
            type: string
            enum: [easy, hard, extreme, impossible]
          description: If provided, only games of this difficulty count toward the ranking. Omit for global ranking.
      responses:
        '200':
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: "64a7f3bc2e4e2a001f3d1234"
                    username:
                      type: string
                      example: "testuser"
                    photoURL:
                      type: string
                      example: "avatar_1.png"
                    points:
                      type: integer
                      example: 2400
                    gamesPlayed:
                      type: integer
                      example: 10
                    gamesWon:
                      type: integer
                      example: 6
                    gamesLost:
                      type: integer
                      example: 4
        '400':
          description: Invalid difficulty value
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid difficulty"
        '401':
          description: Unauthorized – missing or invalid token
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
  /register:
    post:
      summary: Creates a new user given the name and id
      description: |
        Creates a new user document in MongoDB after Firebase authentication.
        Requires a valid Firebase ID token in the Authorization header.
        The token provides the Firebase UID which is linked to the new user.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ username ]
              properties:
                username:
                  type: string
                  description: The username for the new user
                  example: "Pablo"
      responses:
        '201':
          description: Returns the message "Welcome <userName>" and user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Welcome Pablo"
                  user:
                    type: object
                    properties:
                      username:
                        type: string
                        example: "Pablo"
                      _id:
                        type: string
                        example: "64a7f3bc2e4e2a001f3d1234"
        '401':
          description: Unauthorized – missing or invalid token
        '409':
          description: There is already an existing user with the same id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User already registered"
        '500':
          description: There is an unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal error"
  /games:
    post:
      summary: Saves game result
      description: Saves the winner, duration, number of turns, difficulty and game mode of a game
        linked to a user by id. Also increments the user's gamesPlayed and gamesWon/gamesLost counters.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winner, durationMs, turns, difficulty]
              properties:
                winner:
                  type: string
                  enum: [player, bot]
                durationMs:
                  type: integer
                  example: 12000
                turns:
                  type: integer
                  example: 15
                difficulty:
                  type: string
                  enum: [easy, hard, extreme, impossible]
                gameMode:
                  type: string
                  enum: [classic, master, fortune]
                  default: classic
      responses:
        '201':
          description: Returns game data
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    example: "64a7f3bc2e4e2a001f3d1234"
                  userId:
                    type: string
                    example: "64a7f3bc2e4e2a001f3d5678"
                  winner:
                    type: string
                    example: "player"
                  durationMs:
                    type: integer
                    example: 12000
                  turns:
                    type: integer
                    example: 15
                  difficulty:
                    type: string
                    example: "hard"
                  gameMode:
                    type: string
                    example: "classic"
                  createdAt:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
                  updatedAt:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
        '401':
          description: Unauthorized – missing or invalid token
        '409':
          description: There is already an existing user with the same id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User already registered"
        '500':
          description: There is an unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal error"
  /games/me:
    post:
      summary: Retrieves user games
      description: Returns the lastest 50 games from a user given the user id
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Returns the last games
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: "64a7f3bc2e4e2a001f3d1234"
                    userId:
                      type: string
                      example: "64a7f3bc2e4e2a001f3d5678"
                    durationMs:
                      type: integer
                      example: 10000
                    turns:
                      type: integer
                      example: 17
                    difficulty:
                      type: string
                      example: "extreme"
        '401':
          description: Unauthorized – missing or invalid token
        '404':
          description: There is no user with that id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not found"
        '500':
          description: There is an unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal error"
  /users/me/profile:
    put:
      summary: Updates current user profile
      description: Updates the authenticated user's profile information.
        Allows partial updates of username and/or photoURL.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "NuevoNombre"
                photoURL:
                  type: string
                  example: "avatar_3.png"
              minProperties: 1
            examples:
              updateUsername:
                summary: Update username only
                value:
                  username: "NuevoNombre"
              updatePhotoURL:
                summary: Update photoURL only
                value:
                  photoURL: "avatar_2.png"
              updateBoth:
                summary: Update both username and photoURL
                value:
                  username: "NuevoNombre"
                  photoURL: "avatar_2.png"
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    example: "NuevoNombre"
                  photoURL:
                    type: string
                    example: "avatar_2.png"
        '401':
          description: Unauthorized – missing or invalid token
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Usuario no encontrado"
        '500':
          description: Error while updating user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT